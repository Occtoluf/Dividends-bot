[project]
name = "dividends-bot"
version = "0.1.0"
description = "Telegram bot for tracking T-Bank portfolio dividends"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.4,<4",
    "t-tech-investments",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "rapidfuzz>=3.6",
    "aiosqlite>=0.20",
]

# t-tech-investments лежит не на PyPI, а в приватном индексе T-Bank.
# Для установки укажите --extra-index-url:
#   pip install -e . --extra-index-url https://opensource.tbank.ru/api/v4/projects/238/packages/pypi/simple
# Либо используйте requirements.txt, где этот индекс уже прописан первой строкой.

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
