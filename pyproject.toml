[project]
name = "dividends-bot"
version = "0.1.0"
description = "Telegram bot for tracking T-Bank portfolio dividends"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.4,<4",
    "tinkoff-investments>=0.2.0b114",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "rapidfuzz>=3.6",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
